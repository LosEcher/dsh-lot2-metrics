# publish-readiness 配置（每个仓一份，随仓发布）
#
# 放法: <repo>/tools/publish-readiness.conf
# 引擎: <repo>/tools/publish-readiness.sh（本文件与引擎同目录时自动被加载）
# 判据与分层的完整说明见 dsh-dashboards/tools/README.md（canonical 源在那，各仓副本自足）。

# ── 仓的定位 ────────────────────────────────────────────────
PUBLISH_TARGET=1
REPO_DESC="DSH lot2 指标插件：只读呈现 lot2 后端指标快照（运行期 gauge / 阈值 / DB 查询画像）+ 两个只读 agent 工具"

# ── P0-3 发布面 ─────────────────────────────────────────────
EXPECT_REMOTE=1
EXPECT_VISIBILITY=public

# ── P0-4 身份面 ─────────────────────────────────────────────
# 插件仓没有二进制产物可 grep ⇒ degraded：只查版本号 + HEAD。
IDENTITY_MODE=degraded
IDENTITY_ARTIFACT=""
IDENTITY_NEEDLE=auto
VERSION_FILE=""
VERSION_FIELD=""

# ── P0-5 破坏性变更记录 ─────────────────────────────────────
# 本插件对外承诺的契约是**消费侧**的：快照信封 v1（未知 v 一律拒绝解读，不猜字段）。
# 只要这条不破，就不需要单独的 BREAKING 台账；真破了必须在这里补 REQUIRE_BREAKING_RECORD=1。
BREAKING_RECORD=""
REQUIRE_BREAKING_RECORD=0

# ── 扫描范围 ────────────────────────────────────────────────
HISTORY_SCAN=auto
HISTORY_MAX_COMMITS=2000
SELF_TEST=1

# ── 白名单 / 附加判据 ───────────────────────────────────────
# 只读快照路径与端点名不是密钥；本插件不含任何凭据（token 一律由采集侧持 600 文件）。
ALLOW_PATTERNS=""
EXTRA_LEAK_PATTERNS=""
LOCAL_HOOK=""
